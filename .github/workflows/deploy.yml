name: 🚀 Deploy Hugo to Firebase

on:
  push:
    branches:
      - master
      - staging
      - preprod
      - set_up_ci_cd

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository (no submodules)
        uses: actions/checkout@v4
        with:
          submodules: false        # avoid pulling every submodule
          fetch-depth: 0

      - name: 📁 Init only the Ananke theme submodule
        run: |
          git submodule update --init themes/ananke
          # we deliberately skip themes/hugo-bearblog

      - name: ⚙️ Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.123.7'
          extended: true

      - name: 📦 Cache Hugo resources
        uses: actions/cache@v3
        with:
          path: |
            resources
            ~/.cache/hugo
          key: ${{ runner.os }}-hugo-${{ hashFiles('**/*.md') }}
          restore-keys: |
            ${{ runner.os }}-hugo-

      - name: 🏗️ Build Hugo site
        run: hugo --minify

      - name: 🔥 Install Firebase CLI
        run: npm install -g firebase-tools

      - name: 🚀 Deploy to Firebase (Production)
        if: github.ref == 'refs/heads/master'
        run: firebase deploy --only hosting --token "$FIREBASE_TOKEN"

      - name: 🧪 Deploy to Firebase (Staging Channel)
        if: github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/preprod'
        run: firebase hosting:channel:deploy staging --token "$FIREBASE_TOKEN"
        
    env:
      FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}